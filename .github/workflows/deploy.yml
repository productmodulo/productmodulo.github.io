name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Restore assets from recent deploys
        uses: actions/cache/restore@v4
        with:
          path: .asset-history
          key: astro-assets-${{ github.run_id }}
          restore-keys: astro-assets-
      - name: Keep assets from recent deploys
        run: scripts/retain-assets.sh .asset-history "${{ github.run_number }}"
      - name: Save asset history
        uses: actions/cache/save@v4
        with:
          path: .asset-history
          key: astro-assets-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
